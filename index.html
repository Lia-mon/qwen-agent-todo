<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
</head>
<body>
    <!-- ── Task Rendering Panel ───────────────────────────────── -->
    <section class="panel">
      <div class="filters">
        <div class="filter-group">
          <span class="filter-group-label">Status</span>
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="filter-group">
          <span class="filter-group-label">Importance</span>
          <button class="filter-btn importance-filter active" data-ifilter="all">All</button>
          <button class="filter-btn importance-filter" data-ifilter="high">High</button>
          <button class="filter-btn importance-filter" data-ifilter="medium">Med</button>
          <button class="filter-btn importance-filter" data-ifilter="low">Low</button>
        </div>

        <div class="filter-group">
          <span class="filter-group-label">Deadline</span>
          <button class="filter-btn deadline-filter active" data-dfilter="all">All</button>
          <button class="filter-btn deadline-filter" data-dfilter="overdue">Overdue</button>
          <button class="filter-btn deadline-filter" data-dfilter="today">Today</button>
          <button class="filter-btn deadline-filter" data-dfilter="week">This Week</button>
        </div>

        <div class="filter-group">
          <span class="filter-group-label">Emergence</span>
          <button class="filter-btn emergence-filter active" data-efilter="all">All</button>
          <button class="filter-btn emergence-filter" data-efilter="stress">Stress</button>
          <button class="filter-btn emergence-filter" data-efilter="balance">Balance</button>
          <button class="filter-btn emergence-filter" data-efilter="lax">Lax</button>
        </div>
      </div>

      <ul id="todo-list"></ul>

      <footer class="footer" id="footer">
        <span id="count"></span>
      </footer>
    </section>
  </div>

  <!-- ── Add Task Dialog ──────────────────────────────────────── -->
  <dialog id="add-task-dialog">
    <form id="todo-form" method="dialog">
      <h3 class="dialog-title">New Task</h3>
      <input type="text" id="todo-input" placeholder="What needs to be done?" required>

      <div class="dialog-fields">
        <label>
          Repeatable
          <select id="repeat-select">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="30s">30s (test)</option>
          </select>
        </label>
        <label>
          Importance
          <select id="importance-select">
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label>
          Duration
          <select id="duration-select">
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="30">30 min</option>
            <option value="60">1 hr</option>
            <option value="multi">Multiple hours</option>
          </select>
        </label>
      </div>
        <label>
          Deadline
          <input type="datetime-local" id="deadline-input">
        </label>
      <button type="submit" class="dialog-submit">Add</button>
    </form>
  </dialog>

  <!-- ── FAB Button ───────────────────────────────────────────── -->
  <button id="fab-btn" class="fab-btn" title="Add Task">+</button>

  <script src="app.js"></script>
</body>
</html>
