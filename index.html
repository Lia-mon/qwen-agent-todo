<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
</head>
<body>
 <div class="container">
    <!-- ── Task Creation Panel ──────────────────────────────────── -->
    <section class="panel creation-panel">
      <h2 class="panel-title">Create Task</h2>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="What needs to be done?" autofocus>
        <button type="submit">Add</button>
      </form>

      <div class="extra-fields">
        <label>
          Repeatable
          <select id="repeat-select">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="30s">30s (test)</option>
          </select>
        </label>
        <label>
         Importance
          <select id="importance-select">
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>
        <label>
         Emergence
          <select id="emergence-select">
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="low">Low</option>
          </select>
        </label>
      </div>
    </section>

    <!-- ── Task Rendering Panel ───────────────────────────────── -->
    <section class="panel task-panel">
      <h2 class="panel-title">Tasks</h2>

      <div class="filters">
        <div class="filter-group">
          <span class="filter-group-label">Status</span>
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="filter-group">
          <span class="filter-group-label">Importance</span>
          <button class="filter-btn importance-filter active" data-ifilter="all">All</button>
          <button class="filter-btn importance-filter" data-ifilter="high">High</button>
          <button class="filter-btn importance-filter" data-ifilter="medium">Med</button>
          <button class="filter-btn importance-filter" data-ifilter="low">Low</button>
        </div>

        <div class="filter-group">
          <span class="filter-group-label">Emergence</span>
          <button class="filter-btn emergence-filter active" data-efilter="all">All</button>
          <button class="filter-btn emergence-filter" data-efilter="high">High</button>
          <button class="filter-btn emergence-filter" data-efilter="medium">Med</button>
          <button class="filter-btn emergence-filter" data-efilter="low">Low</button>
        </div>
      </div>

      <ul id="todo-list"></ul>

      <footer class="footer" id="footer">
        <span id="count"></span>
      </footer>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
