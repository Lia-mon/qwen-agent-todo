<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
</head>
<body>
    <!-- ── Task Rendering Panel ───────────────────────────────── -->
    <section class="panel">
        <div class="filter-bar">
            <button class="status-btn active" data-filter="active">Active</button>
            <button class="status-btn" data-filter="completed">Completed</button>
            <button class="status-btn" data-filter="trash">Trash</button>
            <button id="filter-toggle" class="filter-toggle" title="Filters">⚙</button>
            <button id="fab-btn" class="fab-btn" title="Add Task">+</button>
        </div>
        <div class="filters">
            <div class="filter-group">
            <span class="filter-group-label">Importance</span>
            <button class="filter-btn importance-filter active" data-ifilter="all">All</button>
            <button class="filter-btn importance-filter" data-ifilter="high">High</button>
            <button class="filter-btn importance-filter" data-ifilter="medium">Med</button>
            <button class="filter-btn importance-filter" data-ifilter="low">Low</button>
            </div>

            <div class="filter-group">
            <span class="filter-group-label">Deadline</span>
            <button class="filter-btn deadline-filter active" data-dfilter="all">All</button>
            <button class="filter-btn deadline-filter" data-dfilter="overdue">Overdue</button>
            <button class="filter-btn deadline-filter" data-dfilter="today">Today</button>
            <button class="filter-btn deadline-filter" data-dfilter="week">This Week</button>
            </div>

            <div class="filter-group">
            <span class="filter-group-label">Urgency</span>
            <button class="filter-btn urgency-filter active" data-ufilter="all">All</button>
            <button class="filter-btn urgency-filter" data-ufilter="stressy">Stressy</button>
            <button class="filter-btn urgency-filter" data-ufilter="balanced">Balanced</button>
            <button class="filter-btn urgency-filter" data-ufilter="lax">Lax</button>
            </div>
        </div>
        <div id="todo-list" class="todo-list view-active">
          <div id="active-section" class="section section-active">
            <ul id="active-list"></ul>
          </div>
          <div id="completed-section" class="section section-completed">
            <ul id="completed-list"></ul>
          </div>
          <div id="deleted-section" class="section section-deleted">
            <ul id="deleted-list"></ul>
          </div>
        </div>

        <footer class="footer" id="footer">
          <span id="count"></span>
          <div id="pagination" class="pagination"></div>
        </footer>
    </section>

  <!-- ── Add Task Dialog ──────────────────────────────────────── -->
  <dialog id="add-task-dialog" aria-modal="true">
    <form id="todo-form">
      <h3 class="dialog-title">New Task</h3>
      <input type="text" id="todo-input" placeholder="What needs to be done?" required>

      <div class="dialog-fields">
        <label>
          Repeatable
          <select id="repeat-select">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="30s">30s (test)</option>
          </select>
        </label>
        <label>
          Importance
          <select id="importance-select">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>
          Duration
          <select id="duration-select">
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="30">30 min</option>
            <option value="60">1 hr</option>
            <option value="multi">Multiple hours</option>
          </select>
        </label>
      </div>
        <label>
          Deadline
          <input type="datetime-local" id="deadline-input">
        </label>
      <div class="dialog-buttons">
        <button type="button" id="dialog-delete" class="dialog-delete" style="display: none;">Delete</button>
        <button type="button" id="dialog-cancel" class="dialog-cancel">Cancel</button>
        <button type="submit" class="dialog-submit">Add</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
